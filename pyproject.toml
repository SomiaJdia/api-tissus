[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-tissus"
version = "0.1.0"
description = "API de classification de tissus"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "tensorflow==2.17.1",
    "keras==3.15.1",
    "pillow",
    "python-multipart",
    "sqlalchemy",
    "passlib",
    "python-jose",
    "bcrypt==4.0.1",
    "psycopg2-binary",
    "python-dotenv",
    "requests",
    "numpy",
]
